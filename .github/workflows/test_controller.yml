name: Test Controller

on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  test-controller:
    runs-on: windows-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.9
        uses: actions/setup-python@v3
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run controller test file
        env:
          NAVIGATE_RUN_PLUGIN_INTEGRATION: "1"
        run: |
          python -m pytest test/controller/test_controller.py
